# Temporary nginx logging for the PHP2Shell memory-disclosure hunt
# (CVE-2026-109618 / CVE-2026-109619). Default access logs do not record
# response headers, so the leaked PHPSESSID cookie never reaches disk.
#
# WARNING: this writes live session IDs to disk. Make the file readable only
# by the people doing the hunt, keep it for the hunt window only, then remove
# both lines, reload nginx and delete the log.
#
# 1. In the http {} block:
log_format php2shell '$remote_addr [$time_local] "$request" $status "$sent_http_set_cookie"';

# 2. In the server {} block(s) that proxy to PHP:
access_log /var/log/nginx/php2shell.log php2shell;

# 3. Test and reload:  nginx -t && systemctl reload nginx
# 4. Hunt:             ../hunt/phpsessid-anomalies.sh /var/log/nginx/php2shell.log
#
# Note: depending on the nginx version, $sent_http_set_cookie may hold only
# the first Set-Cookie header of a response. If the application sets several
# cookies, confirm that PHPSESSID is being captured (send a test request),
# or log at a proxy or WAF that records every response header.
